    "Which conclusion about "+concept+" and {f} is mathematically defensible?",
    "Identify the correct interpretation of "+concept+" with respect to {f}."
   ]
  };
  const bank=[];
  frames[typeKey].forEach((frame,fi)=>{
   focus.forEach((f,xi)=>{
    bank.push(frame.replaceAll("{f}",f)+" [Question set "+String(fi*5+xi+1).padStart(2,"0")+"].");
   });
  });
  return bank;
 }
 function shuffle(a){
  const x=a.slice();
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}
  return x;
 }

 function createQuestion(){

   work.appendChild(exhausted);work.classList.remove("assessment-hidden");
   return;
  }
  const chosen=candidates[0];
  runState.usedIds.add(chosen.id);runState.usedTexts.add(chosen.text);
  const countKey=activeChapter+"-"+activeType;runState.counts[countKey]=(runState.counts[countKey]||0)+1;

    "The prior distribution is discarded after the data are observed.",
    "The likelihood is automatically a probability distribution over the unknown parameter.",
    "Bayesian inference does not represent uncertainty about unknown parameters."
   ];
   const optionOrder=shuffle([{text:correctText,correct:true},...distractors.map(text=>({text,correct:false}))]);
   let correctOptionIndex=-1;
   optionOrder.forEach((item,i)=>{
    const op=document.createElement("option");op.value=String(i);op.textContent=String.fromCharCode(65+i)+". "+item.text;

 }
 function updateRunLabel(){const key=activeChapter+"-"+activeType;const label=({1:"MCQ",2:"One line QA",3:"Short Answer",4:"Long Answer"})[activeType]||"Select a question type";const count=runState.counts[key]||0;runLabel.textContent="Assessment run "+runState.run+" · "+label+" · "+count+"/50 · No repeats";}

 assessBtn.addEventListener("click",()=>{
  if(!activeChapter||!activeType||!activeQuestion)return;
  const r=rubric[activeChapter-1];
  let score=0,relevance=0,matched=[],feedback="";

   if(!mcqSelect||mcqSelect.value===""){
    report.textContent="Please select an option before assessment.";report.classList.remove("assessment-hidden");return;
   }

  }else{

   const norm=answer.toLowerCase().replace(/[^a-z0-9\s-]/g," ");

   matched=r.keywords.filter(k=>new RegExp("\\b"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(norm));
   relevance=Math.round(100*matched.length/r.keywords.length);
   const lengthFactor=activeType==="2"?Math.min(1,words.length/5):activeType==="3"?Math.min(1,words.length/24):Math.min(1,words.length/55);
   score=Math.round(relevance*(0.75+0.25*lengthFactor));
   feedback=score>=75?"The response contains several expected concepts and appears substantially aligned with the question.":score>=45?"The response is partly relevant, but important concepts or explanations appear to be missing.":"The response has limited overlap with the expected concepts. Revisit the chapter material and strengthen the explanation.";
  }

  report.textContent="";

  report.appendChild(node("p","assessment-report-status",status+" — rubric-based preliminary assessment"));
  const metrics=node("div","assessment-metrics");
  [["Conceptual correctness indicator",score+"%"],["Relevance indicator",relevance+"%"]].forEach(([k,v])=>{const item=node("div","assessment-metric");item.appendChild(node("strong","",k));item.appendChild(node("span","",v));metrics.appendChild(item);});
  report.appendChild(metrics);
  report.appendChild(node("p","","Feedback: "+feedback));
  report.appendChild(node("p","","Expected concepts detected: "+(matched.length?matched.join(", "):"No rubric keywords detected.")));
  const model=node("div","assessment-model");model.appendChild(node("strong","","Reference answer / key idea"));model.appendChild(node("p","",r.model));report.appendChild(model);
  report.appendChild(node("p","assessment-caveat","Evaluation limitation: this is an on-device keyword-and-rubric check, not a full semantic evaluation by an AI examiner. Correct synonyms, alternative derivations and valid arguments may not always be recognized. Use the report as formative guidance; a teacher should make the final judgment."));
  report.classList.remove("assessment-hidden");
 });

function showWorkspace(idx,k,right,subIndex=-1){
 right.innerHTML="";
 const sub=(chapterSubtopics[idx]||[])[k]||[];
 if(subIndex===sub.length){renderIllustrations(idx,k,right);return;}
 renderLesson(idx,k,subIndex,right);const c=chapters[idx],cards=node("div","cards");
 const focus=node("article","card");focus.style.background=fills[(idx+1)%6];focus.innerHTML="<h3>Chapter learning focus</h3><p>"+c.intro+"</p><p><b>Selected topic:</b> "+c.topics[k]+"</p>";
 const outcomes=node("article","card");outcomes.style.background=fills[(idx+2)%6];outcomes.innerHTML="<h3>Learning outcomes</h3><ul><li>Define and explain the selected concepts.</li><li>Relate prior assumptions to the sampling model.</li><li>Derive or verify the relevant mathematical result.</li><li>Interpret uncertainty in context.</li></ul>";
 cards.append(focus,outcomes);right.appendChild(cards);
 const lab=node("article","card");lab.style.background=fills[(idx+3)%6];lab.innerHTML="<h3>Interactive parameter and prior-distribution laboratory</h3><p class='small'>Select a model and its compatible prior. Parameter controls and the posterior visualization respond to your entries.</p>";
 const controls=node("div","controls");
 const modelLabel=node("label","","Model ");const model=document.createElement("select");
 [["beta","Beta-Binomial"],["gamma","Gamma-Poisson"],["normal","Normal-Normal"]].forEach(([v,t])=>{const o=document.createElement("option");o.value=v;o.textContent=t;model.appendChild(o);});
 model.value=idx===5?"gamma":idx===6?"normal":"beta";modelLabel.appendChild(model);controls.appendChild(modelLabel);
 const priorLabel=node("label","","Prior distribution ");const prior=document.createElement("select");priorLabel.appendChild(prior);controls.appendChild(priorLabel);
 function addNumber(label,value,id,min,max,step){const l=node("label","",label+" ");const x=document.createElement("input");x.type="number";x.id=id;x.value=value;x.min=min;x.max=max;x.step=step||"any";l.appendChild(x);controls.appendChild(l);}
 addNumber("Successes / count",8,"success",0,100000,1);addNumber("Failures / exposure",2,"failure",0,100000,1);
 addNumber("Prior parameter α / shape",2,"pa",0.01,1000,0.1);addNumber("Prior parameter β / rate / variance",2,"pb",0.01,1000,0.1);
 const update=node("button","btn","Update posterior");const reset=node("button","btn light","Reset");controls.append(update,reset);lab.appendChild(controls);
 const formula=node("div","formula","Posterior ∝ Likelihood × Prior");lab.appendChild(formula);
 const plot=node("div","plot"),canvas=document.createElement("canvas");canvas.width=1000;canvas.height=270;plot.appendChild(canvas);lab.appendChild(plot);
 const result=node("div","result","Select a compatible prior and update the parameters.");lab.appendChild(result);right.appendChild(lab);
 const note=node("article","card");note.style.background=fills[(idx+4)%6];note.innerHTML="<h3>Statistical reasoning task</h3><p>Explain why the prior is defensible, identify the sampling assumptions, and interpret how the likelihood changes the prior. Ask an AI assistant to critique your derivation, then verify its claims independently.</p>";right.appendChild(note);
 function configurePrior(){
  const opts=model.value==="beta"?[["Beta(2, 2)",2,2],["Beta(1, 1)",1,1],["Beta(5, 5)",5,5],["Beta(0.5, 0.5)",.5,.5]]:
   model.value==="gamma"?[["Gamma(2, 1)",2,1],["Gamma(1, 1)",1,1],["Gamma(3, 2)",3,2],["Gamma(0.5, 0.5)",.5,.5]]:
   [["Normal(0, variance 1)",0,1],["Normal(0, variance 4)",0,4],["Normal(0, variance 10)",0,10]];
  prior.innerHTML="";opts.forEach(o=>{const option=document.createElement("option");option.value=o[0];option.textContent=o[0];prior.appendChild(option);});
  prior.value=opts[0][0];document.getElementById("pa").value=opts[0][1];document.getElementById("pb").value=opts[0][2];
  prior.onchange=()=>{const o=opts.find(x=>x[0]===prior.value);document.getElementById("pa").value=o[1];document.getElementById("pb").value=o[2];calculate();};
 }
 function draw(fn,xmax){
  const ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height,p=55,pts=[];let ymax=0;
  for(let i=0;i<=500;i++){const x=xmax*i/500;let y=fn(x);if(!Number.isFinite(y)||y<0)y=0;pts.push([x,y]);ymax=Math.max(ymax,y);}
  ymax=ymax*1.12||1;const X=x=>p+x/xmax*(w-2*p),Y=y=>h-p-y/ymax*(h-2*p);
  ctx.clearRect(0,0,w,h);ctx.fillStyle="#ffd8e8";ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#b7e4b1";ctx.beginPath();ctx.moveTo(X(0),Y(0));pts.forEach(([x,y])=>ctx.lineTo(X(x),Y(y)));ctx.lineTo(X(xmax),Y(0));ctx.closePath();ctx.fill();
  ctx.strokeStyle="#8b0000";ctx.lineWidth=3;ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y)));ctx.stroke();
  ctx.strokeStyle="#443344";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p,18);ctx.lineTo(p,h-p);ctx.lineTo(w-p,h-p);ctx.stroke();
  ctx.fillStyle="#28222d";ctx.font="16px Arial";ctx.fillText("Posterior density (relative scale)",p,16);ctx.fillText("Parameter value",w/2-50,h-10);
 }
 function betaDensity(x,a,b){if(x<=0||x>=1)return 0;return Math.pow(x,a-1)*Math.pow(1-x,b-1);}
 function gammaDensity(x,a,r){if(x<=0)return 0;return Math.pow(x,a-1)*Math.exp(-r*x);}
 function calculate(){
  const x=Math.max(0,Number(document.getElementById("success").value)||0),f=Math.max(0,Number(document.getElementById("failure").value)||0);
  const a=Math.max(.01,Number(document.getElementById("pa").value)||1),b=Math.max(.01,Number(document.getElementById("pb").value)||1);
  if(model.value==="beta"){
   const A=a+x,B=b+f,mean=A/(A+B),variance=A*B/(Math.pow(A+B,2)*(A+B+1));
   formula.textContent="Beta("+a+", "+b+") prior × Binomial likelihood → Beta("+A.toFixed(2)+", "+B.toFixed(2)+") posterior";
   draw(t=>betaDensity(t,A,B),1);
   result.innerHTML="<b>Posterior mean:</b> "+mean.toFixed(4)+" &nbsp; <b>Variance:</b> "+variance.toFixed(5)+" &nbsp; <b>SD:</b> "+Math.sqrt(variance).toFixed(4)+"<br>Posterior mode, when A>1 and B>1: "+((A-1)/(A+B-2)).toFixed(4)+". The posterior summarizes uncertainty in the Binomial success probability.";
  }else if(model.value==="gamma"){
   const count=x,exposure=Math.max(.01,f||1),A=a+count,R=b+exposure,mean=A/R,variance=A/(R*R);
   formula.textContent="Gamma(shape "+a+", rate "+b+") prior × Poisson counts → Gamma(shape "+A.toFixed(2)+", rate "+R.toFixed(2)+") posterior";
   draw(t=>gammaDensity(t,A,R),Math.max(5,mean*4));
   result.innerHTML="<b>Posterior mean rate:</b> "+mean.toFixed(4)+" &nbsp; <b>Variance:</b> "+variance.toFixed(5)+" &nbsp; <b>SD:</b> "+Math.sqrt(variance).toFixed(4)+"<br>Here the count field is the observed event count and the second field is exposure. Gamma uses shape-rate parameterization.";
  }else{
   const priorVar=b,knownVar=1,n=Math.max(1,x+f),sampleMean=(x-f)/n;
   const postVar=1/(1/priorVar+n/knownVar),postMean=postVar*(n*sampleMean/knownVar);
   formula.textContent="Normal prior N(0, "+priorVar+") × Normal likelihood (known variance 1) → Normal posterior";
   draw(t=>Math.exp(-.5*Math.pow((t-postMean)/Math.sqrt(postVar),2)),Math.max(4,Math.abs(postMean)+4));
   result.innerHTML="<b>Posterior mean:</b> "+postMean.toFixed(4)+" &nbsp; <b>Variance:</b> "+postVar.toFixed(5)+" &nbsp; <b>SD:</b> "+Math.sqrt(postVar).toFixed(4)+"<br>Illustrative encoding: prior mean 0, prior variance entered above, known observation variance 1, and toy sample mean (successes − failures)/n. For substantive inference, enter a real sample summary.";
  }
 }

 update.addEventListener("click",calculate);
